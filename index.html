<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问验证 · 深圳国际金枪鱼交易中心数字化交易平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B2A4A'/%3E%3Cpath d='M32 12c8 6 14 10 14 18 0 7-6 11-14 11s-14-4-14-11c0-8 6-12 14-18z' fill='none' stroke='%23E9B824' stroke-width='3'/%3E%3Ccircle cx='32' cy='30' r='4' fill='%231FB6C6'/%3E%3C/svg%3E">
<style>
  :root{--navy:#0B2A4A;--navy2:#071E36;--cyan:#1FB6C6;--gold:#E9B824;--red:#D6303F;--ink:#1B2D3E;--ink2:#516575;--line:#E2E9EF}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:28px}
  .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
  .mark svg{width:34px;height:34px}
  h1{font-size:19px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
  .sub{font-size:13px;color:#8FA9BB;line-height:1.6}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:26px 24px;backdrop-filter:blur(6px)}
  label{display:block;font-size:12.5px;color:#AEC5D5;margin-bottom:8px;letter-spacing:.5px}
  .field{position:relative;margin-bottom:18px}
  input[type=password]{width:100%;height:44px;padding:0 44px 0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#fff;font-size:14.5px;font-family:inherit;outline:none;transition:border-color .2s}
  input[type=password]:focus{border-color:var(--cyan)}
  input[type=password]::placeholder{color:#5E7D96}
  .toggle{position:absolute;right:6px;top:6px;width:32px;height:32px;border:none;background:transparent;color:#8FA9BB;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .toggle:hover{color:#fff;background:rgba(255,255,255,.06)}
  .toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
  button[type=submit]{width:100%;height:44px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold),#F2CE54);color:#1A2C40;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .2s,opacity .2s}
  button[type=submit]:hover{transform:translateY(-1px)}
  button[type=submit]:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .msg{min-height:20px;margin-top:14px;font-size:13px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
  .msg.err{color:#FF8B96}
  .msg.ok{color:#5FD9A8}
  .msg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
  .foot{margin-top:24px;text-align:center;font-size:11.5px;color:#5E7D96;line-height:1.8}
  .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#E9B824" stroke-width="1.8"><path d="M12 3c3.2 2.4 5.6 4 5.6 7.2 0 2.8-2.4 4.4-5.6 4.4s-5.6-1.6-5.6-4.4C6.4 7 8.8 5.4 12 3z"/><circle cx="12" cy="10" r="1.6" fill="#1FB6C6" stroke="none"/></svg></div>
    <h1>深圳国际金枪鱼交易中心</h1>
    <div class="sub">数字化 B2B2C 交易服务平台 · 演示原型</div>
  </div>

  <form class="card" id="f" autocomplete="off">
    <label for="pw">访问密码</label>
    <div class="field">
      <input type="password" id="pw" placeholder="请输入访问密码" autocomplete="current-password" autofocus>
      <button type="button" class="toggle" id="tg" title="显示密码" aria-label="显示密码">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" id="btn">进 入 平 台</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">
    主办：深圳国际金枪鱼交易中心（深圳港）<br>
    运营：深圳市数字渔农业科技有限责任公司
  </div>
</div>

<script>
(function(){
  var form=document.getElementById('f'), pw=document.getElementById('pw'),
      btn=document.getElementById('btn'), msg=document.getElementById('msg'),
      tg=document.getElementById('tg'), card=document.querySelector('.card');
  var b64=function(u){var s=u.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;};
  var enc=new TextEncoder();

  function show(text,kind){
    msg.className='msg'+(kind?' '+kind:'');
    msg.textContent=text;
  }
  function showHtml(text,kind){
    msg.className='msg'+(kind?' '+kind:'');
    msg.innerHTML=text;
  }

  tg.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    tg.setAttribute('aria-label',show?'隐藏密码':'显示密码');
    tg.title=show?'隐藏密码':'显示密码';
    pw.focus();
  });

  function deriveKey(password,saltB64,iterations){
    return crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey'])
      .then(function(k){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(saltB64),iterations:iterations,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
      });
  }

  function decrypt(key,bytes){
    // 布局：iv | data | tag —— tag 位于密文末尾，由 WebCrypto 自行提取校验
    var iv=bytes.subarray(0,12), body=bytes.subarray(12);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},key,body)
      .catch(function(){throw new Error('bad');});
  }

  function fetchJson(url){
    return fetch(url,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
  }

  function boot(){
    return Promise.all([fetchJson('config.json'),fetchJson('credential.json')])
    .then(function(res){
      var cfg=res[0], cred=res[1];
      return deriveKey(pw.value,cfg.salt,cfg.iterations).then(function(key){
        return fetch('page.enc',{cache:'no-store'}).then(function(r){return r.arrayBuffer();}).then(function(buf){
          return decrypt(key,new Uint8Array(buf)).then(function(html){
            var doc=new DOMParser().parseFromString(new TextDecoder().decode(html),'text/html');
            var assets={};
            return Promise.all(cfg.assets.map(function(a){
              return fetch('assets/'+encodeURIComponent(a.name)+'.enc',{cache:'no-store'})
                .then(function(r){return r.arrayBuffer();})
                .then(function(b){return decrypt(key,new Uint8Array(b)).then(function(plain){
                  assets[a.name]=new Blob([plain],{type:a.name.endsWith('.pdf')?'application/pdf':'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
                });});
            })).then(function(){return {doc:doc,assets:assets,cfg:cfg};});
          });
        });
      });
    })
    .then(function(ctx){
      // 用解密后的文档替换当前页面，资源下载改为本地 Blob
      var doc=ctx.doc, assets=ctx.assets;
      doc.querySelectorAll('a[href^="assets/"]').forEach(function(a){
        var name=decodeURIComponent(a.getAttribute('href').replace('assets/',''));
        if(!assets[name])return;
        a.setAttribute('href',URL.createObjectURL(assets[name]));
        a.setAttribute('download',name);
      });
      var style=doc.querySelectorAll('style'), script=doc.querySelectorAll('script');
      var css=''; style.forEach(function(s){css+=s.textContent;});
      var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
      document.body.innerHTML=doc.body.innerHTML;
      // 跳过原封面：直接显示平台主体（解密已通过，无需再次点击进入）
      var cover=document.getElementById('cover'), app=document.getElementById('app');
      if(cover){cover.classList.add('hide');cover.style.display='none';}
      if(app)app.classList.add('show');
      // 按原顺序注入脚本：先内联后外链，确保依赖顺序正确
      var srcs=[];
      script.forEach(function(s){
        if(s.src){srcs.push(s.src);}
        else if(s.textContent.trim()){var t=document.createElement('script');t.textContent=s.textContent;document.body.appendChild(t);}
      });
      srcs.forEach(function(s){ var t=document.createElement('script');t.src=s;document.body.appendChild(t); });
      // 触发原封面的图表渲染逻辑（解密已通过，无需再点封面）
      try{ if(typeof renderAllCharts==='function')renderAllCharts(); }catch(e){}
      if(window.history&&history.replaceState)history.replaceState(null,'','./');
    })
    .catch(function(e){
      show('密码错误，请重新输入','err');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      pw.select();
    });
  }

  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!pw.value){show('请输入访问密码','err');return;}
    btn.disabled=true; btn.textContent='验 证 中';
    showHtml('<span class="spin"></span>正在验证…');
    var done=function(){ btn.disabled=false; btn.textContent='进 入 平 台'; };
    boot().then(function(){ done(); }, function(){ done(); });
  });
})();
</script>
</body>
</html>
